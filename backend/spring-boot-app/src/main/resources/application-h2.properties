# =========================================================
# Fallback H2 In-Memory Configuration Profile
# Usage: --spring.profiles.active=h2
# =========================================================

server.port=8080

spring.datasource.url=jdbc:h2:file:./data/water_monitoring;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

# =========================================================
# Gemini AI & Multilingual Chatbot & Translation Configuration (H2 profile)
# Multi-Key Rotation: Supports 3 API keys with automatic round-robin & failover
# =========================================================
gemini.api.key1=${GEMINI_API_KEY_1:}
gemini.api.key2=${GEMINI_API_KEY_2:}
gemini.api.key3=${GEMINI_API_KEY_3:}
gemini.api.keys=${GEMINI_API_KEYS:}
gemini.api.key=${gemini.api.key1}
gemini.api.model=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/

google.translate.api.key=${GOOGLE_TRANSLATE_API_KEY:}
google.translate.api.url=${GOOGLE_TRANSLATE_API_URL:https://translation.googleapis.com/language/translate/v2}

chat.max-message-length=1000
chat.rate-limit.rpm=20
