# =========================================================
# Water Usage Monitoring System — Spring Boot Configuration
# Server Port & Database Settings
# =========================================================

# Render (and most PaaS hosts) assign the port at runtime via $PORT — must
# listen on whatever it gives us, falling back to 8080 for local dev.
server.port=${PORT:8080}
server.servlet.context-path=/

# Database — defaults are local MySQL (today's dev setup, unchanged). For a
# deployed Postgres database (e.g. Supabase), set these 5 env vars instead;
# nothing here needs to change per-database beyond that. No password default
# on purpose — see application.properties (gitignored, project root) for the
# local value, and set DATABASE_PASSWORD in the host's dashboard for deploys.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/water_monitoring?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# Hibernate & JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DATABASE_DIALECT:org.hibernate.dialect.MySQLDialect}

# Jackson JSON Configuration
spring.jackson.serialization.indent_output=true
spring.jackson.default-property-inclusion=non_null

# Logging Level Configuration
logging.level.org.springframework.web=INFO
logging.level.com.watermonitoring=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Spring Boot Mail / Primary Admin Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:watermonitoring.system1612@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
# Fixed Official Admin Email Destination
app.admin.email=${ADMIN_EMAIL:watermonitoring1612@gmail.com}

# Frontend Application URL (used for login link in emails)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# =========================================================
# Gemini AI & Multilingual Chatbot & Translation Configuration
# Multi-Key Rotation: Supports 3 API keys with automatic round-robin & failover
# =========================================================
gemini.api.key1=${GEMINI_API_KEY_1:${GEMINI_API_KEY:}}
gemini.api.key2=${GEMINI_API_KEY_2:}
gemini.api.key3=${GEMINI_API_KEY_3:}
gemini.api.keys=${GEMINI_API_KEYS:}
gemini.api.key=${gemini.api.key1}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/}

# Optional Google Cloud Translation API Configuration
google.translate.api.key=${GOOGLE_TRANSLATE_API_KEY:}
google.translate.api.url=${GOOGLE_TRANSLATE_API_URL:https://translation.googleapis.com/language/translate/v2}

# Chat Rate Limiting and Input Constraints
chat.max-message-length=1000
chat.rate-limit.rpm=20
